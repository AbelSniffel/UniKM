name: unikm
description: "UniKM - Universal Key Manager for managing game activation keys"
publish_to: 'none'
version: 1.3.0

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.3.1

  # Database
  drift: ^2.32.1
  sqlite3: ^3.3.1
  path_provider: ^2.1.5
  path: ^1.9.1

  # Encryption (only cryptography is actually used)
  cryptography: ^2.7.0
  pointycastle: ^4.0.0

  # HTTP & API
  http: ^1.2.0
  dio: ^5.7.0

  # Desktop Window Management
  window_manager: ^0.5.1
  screen_retriever: ^0.2.0
  
  # UI & Animations
  flutter_animate: ^4.5.2
  visibility_detector: ^0.4.0+2
  # rive: ^0.13.20 #Currently disabled due to missing ClangCL build tools
  
  # Image Handling
  cached_network_image: ^3.4.1
  
  # Storage
  shared_preferences: ^2.3.4
  
  # Markdown Rendering
  flutter_markdown_plus: ^1.0.7

  # Notifications (OS-level)
  flutter_local_notifications: ^21.0.0

  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.1
  url_launcher: ^6.3.1
  file_picker: ^11.0.2
  share_plus: ^12.0.2
  collection: ^1.19.0
  ffi: ^2.1.4
  package_info_plus: ^9.0.0
  device_info_plus: ^11.2.0
  desktop_drop: ^0.7.0
  
  # Icons
  font_awesome_flutter: ^11.0.0

hooks:
  user_defines:
    sqlite3:
      source: sqlite3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  # TODO: Add custom assets when available
  # assets:
  #   - assets/images/
  #   - assets/themes/
  #   - assets/icons/

