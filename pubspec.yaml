name: unikm
description: "UniKM - Universal Key Manager for managing game activation keys"
publish_to: 'none'
version: 1.4.0

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^3.4.3

  # Database
  drift: ^2.35.1
  # 3.6+ needs meta newer than Flutter 3.44.8's SDK pin.
  sqlite3: ^3.5.2
  path_provider: ^2.1.6
  path: ^1.9.1

  # Encryption, including legacy encrypted imports
  cryptography: ^2.9.0
  pointycastle: ^4.0.0

  # HTTP & API
  http: ^1.6.0
  dio: ^5.11.1

  # Desktop Window Management
  window_manager: ^0.5.2
  screen_retriever: ^0.2.2
  
  # Image Handling
  # 4.x needs material_ui, whose available releases require Dart 3.13+.
  cached_network_image: ^3.4.1
  
  # Storage
  shared_preferences: ^2.5.5
  
  # Markdown Rendering
  flutter_markdown_plus: ^1.0.12

  # Notifications (OS-level)
  flutter_local_notifications: ^22.3.1

  # Utilities
  uuid: ^4.6.0
  intl: ^0.20.3
  url_launcher: ^6.3.3
  file_picker: ^13.1.0
  
  # Desktop save-location selection without writing/truncating the destination.
  file_selector: ^1.1.0
  share_plus: ^13.3.1
  collection: ^1.19.1
  # Wall-clock reads that tests can fast-forward (idle lock, clipboard expiry).
  clock: ^1.1.2
  pub_semver: ^2.2.1
  device_info_plus: ^13.3.0
  desktop_drop: ^0.8.4
  
  # Icons
  font_awesome_flutter: ^11.0.0
  csv: ^8.0.0
  local_auth: ^3.0.2
  flutter_secure_storage: ^11.2.0
  flutter_displaymode: ^0.7.0

hooks:
  user_defines:
    sqlite3:
      source: sqlite3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  # 2.15.2+ needs meta newer than Flutter 3.44.8's SDK pin.
  build_runner: ^2.15.1

flutter:
  uses-material-design: true
